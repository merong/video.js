              - paragraph: 관련 화면 · 캠페인(목업)
          - listitem:
            - article "집행":
              - heading "집행" [level=4]
              - text: 목업
              - paragraph: 캠페인 안에서 기간·요일·시간대, 등급, 타겟, 소재, 스킵 정책 같은 실제 노출 조건을 정하는 단위예요. 캠페인 상세의 집행 표는 목업이고, 집행 만들기 화면은 준비 중이에요.
              - figure:
                - img "캠페인 아래 집행 하나에 기간, 등급, 타겟, 소재, 스킵 조건이 차례로 붙는 그림이에요.": 캠페인 집행 기간·요일 등급 타겟 소재 스킵
                - group "집행 그림 조작":
                  - button "다시 보기"
              - paragraph: 관련 화면 · 캠페인(목업) › 집행 표, 집행 만들기(준비 중)
          - listitem:
            - article "승인과 승인함":
              - heading "승인과 승인함" [level=4]
              - text: 준비 중
              - paragraph: 편집자가 제출한 지면 편성·집행 변경을 승인자가 승인하거나 사유와 함께 반려하는 절차예요. 승인함 화면은 준비 중이고, 지금 지면 편성 게시는 승인 없이 바로 적용돼요.
              - figure:
                - img "제출한 변경이 승인 대기를 거쳐 승인되면 적용되고, 반려되면 사유와 함께 돌아오는 그림이에요.": 제출 승인 대기 승인 → 적용 반려 사유와 함께 돌아와요
                - group "승인과 승인함 그림 조작":
                  - button "다시 보기"
              - paragraph: 관련 화면 · 승인함(준비 중)
          - listitem:
            - article "등급":
              - heading "등급" [level=4]
              - text: 목업
              - paragraph: 집행이 광고 자리를 얻는 우선순위 종류예요. 기간제 → 보장 → 하우스 순서로 고르고, 셋 다 없으면 자리가 비어요. 지금은 목업 화면에서만 보여요.
              - paragraph: 기간제는 점유율 1~100%(100%는 독점)로, 보장은 목표 노출 수를 고르게 나눠 채워요.
              - figure:
                - img "빈 광고 자리 하나에 기간제 집행을 먼저 찾고, 없으면 보장, 그다음 하우스 순서로 채우는 그림이에요.": 광고 자리 1개 기간제 보장 하우스 빈 자리 앞 등급이 없을 때만 다음으로 가요
                - group "등급 그림 조작":
