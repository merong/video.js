- main "도움말":
  - region "도움말":
    - heading "도움말" [level=1]
    - paragraph: 메뉴마다 하는 일과 화면에 나오는 광고 용어를 설명해요.
    - region "기능 안내":
      - heading "기능 안내" [level=2]
      - heading "기본 작업 순서" [level=3]
      - list "기본 작업 순서":
        - listitem:
          - link "소재 등록":
            - /url: "#/help/creative"
        - listitem:
          - link "지면 편성":
            - /url: "#/help/ad-break"
        - listitem:
          - link "미리보기":
            - /url: "#/help/preview"
        - listitem:
          - link "초안 저장":
            - /url: "#/help/draft"
        - listitem:
          - link "게시":
            - /url: "#/help/publish"
        - listitem:
          - link "재생 테스트":
            - /url: "#/help/play-test"
        - listitem:
          - link "통계":
            - /url: "#/help/start"
      - note: 미리보기와 재생 테스트 · 미리보기는 게시 전에 편집 중인 초안을 재생하고 통계에 남지 않아요. 재생 테스트는 게시한 편성을 재생하고 통계에 기록돼요.
      - heading "메뉴별 화면" [level=3]
      - list:
        - listitem:
          - link "대시보드":
            - /url: "#/dashboard"
          - text: 목업
          - paragraph: 오늘 노출·채움률·완료율·클릭률, 확인할 일, 최근 집행을 예시 값으로 보여 줘요.
        - listitem:
          - link "캠페인":
            - /url: "#/campaigns"
          - text: 목업
          - paragraph: 광고주와의 계약 단위 목록과 상세(집행 표, 승인 이력)를 예시로 보여 줘요.
        - listitem:
          - link "소재":
            - /url: "#/creatives"
          - text: 지금 동작
          - paragraph: 영상·이미지·GIF 소재를 URL이나 파일로 등록하고, 새 버전으로 고치고, 보관해요.
        - listitem:
          - link "지면 편성":
            - /url: "#/schedule"
          - text: 지금 동작
          - paragraph: 사이트·게시판·분류·영상의 광고 구간을 편집해 초안 저장과 게시를 하고, 미리보기와 재생 테스트를 해요.
        - listitem:
          - link "플레이어":
            - /url: "#/players"
          - text: 지금 동작
          - paragraph: 플레이어 종류·스킨·테마·광고 화면을 프리셋으로 저장하고, 설치 코드 만들기와 옵션 설명을 봐요.
        - listitem:
          - link "승인함":
            - /url: "#/approvals"
          - text: 준비 중
          - paragraph: 소재 심사, 지면 편성, 집행 승인 요청을 모아 승인하거나 반려할 화면이에요.
        - listitem:
          - link "리포트":
            - /url: "#/reports"
          - text: 기본 통계 지금 동작 리포트 v2 준비 중
          - paragraph: 위쪽 기본 통계는 실제로 조회하고 CSV로 내려받아요. 아래 차원별 리포트는 아직 없어요.
        - listitem:
          - link "설정":
            - /url: "#/settings"
          - text: 준비 중
          - paragraph: 노출 인정 시간, 자기 승인 허용, 리포트 링크 만료일을 정할 화면이에요.
        - listitem:
          - link "집행 만들기":
            - /url: "#/new-line-item"
          - text: 준비 중
          - paragraph: 캠페인 아래 집행을 단계별로 만들 화면이에요. 메뉴 대신 상단 버튼으로 가요.
    - region "용어 사전":
      - heading "용어 사전" [level=2]
      - group "용어 분류":
        - button "전체49" [pressed]
        - button "광고가 나오는 자리5"
        - button "소재6"
        - button "스킵2"
        - button "편성 대상과 상속6"
        - button "초안과 게시5"
        - button "미리보기와 재생 테스트2"
        - button "플레이어11"
        - button "통계5"
        - button "캠페인과 승인7"
      - region "광고가 나오는 자리":
        - heading "광고가 나오는 자리" [level=3]
        - list:
          - listitem:
            - article "광고 구간":
              - heading "광고 구간" [level=4]
              - text: 지금 동작
              - paragraph: 본편 시작 전, 재생 중 정한 초, 본편이 끝난 뒤 가운데 한 시점에 끼어드는 광고 묶음이에요. 한 구간에 광고를 1~20개 넣으면 차례로 재생돼요.
              - paragraph: 편성 하나에 구간은 100개까지 둘 수 있고, 광고가 없는 빈 구간은 저장할 수 없어요. 프리롤과 포스트롤은 하나씩, 미드롤은 같은 초에 하나만 둘 수 있어요.
              - figure:
                - img "본편 앞에 프리롤, 본편 중간에 미드롤, 본편이 끝난 뒤 포스트롤이 차례로 재생되는 그림이에요.": 프리롤 본편 미드롤 본편 포스트롤
                - group "광고 구간 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 지면 편성 › 광고 구간
          - listitem:
            - article "프리롤":
              - heading "프리롤" [level=4]
              - text: 지금 동작
              - paragraph: 본편이 처음 재생되기 직전에 나오는 구간이에요. 시청자가 재생을 누른 뒤 시작하고, 끝나면 본편이 0초부터 재생돼요.
              - figure:
                - img "프리롤 광고가 먼저 끝까지 재생된 뒤 본편이 0초부터 시작하는 그림이에요.": 프리롤 본편 0초부터
                - group "프리롤 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 지면 편성 › 프리롤 · 시작 전
          - listitem:
            - article "미드롤":
              - heading "미드롤" [level=4]
              - text: 지금 동작
              - paragraph: 본편 재생 위치가 정한 초를 지나면 나오는 구간이에요. 광고가 끝나면 본편이 멈췄던 자리부터 이어져요.
              - paragraph: 새 미드롤은 10초로 채워져요. 앞으로 건너뛰어 여러 미드롤을 한꺼번에 지나면 가장 이른 하나만 나오고, 한 번 나온 구간은 다시 나오지 않아요. 위치가 본편 길이와 같거나 길면 그 영상에서는 프리롤·포스트롤까지 편성 전체가 꺼져요. 서버는 본편 길이를 검사하지 않으니 위치를 직접 확인해 주세요.
              - figure:
                - img "본편이 10초까지 재생되다 멈추고 미드롤 광고가 재생된 뒤 본편이 10초부터 이어지는 그림이에요.": 본편 0~10초 미드롤 10초 본편 10초부터
                - group "미드롤 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 지면 편성 › 본편 재생 위치 (초)
          - listitem:
            - article "포스트롤":
              - heading "포스트롤" [level=4]
              - text: 지금 동작
              - paragraph: 본편이 끝난 뒤 나오는 구간이에요. 포스트롤이 끝나도 본편은 다시 재생되지 않아요.
              - paragraph: 끝까지 건너뛰면 남은 미드롤은 나오지 않고 포스트롤만 나와요.
              - figure:
                - img "본편이 끝까지 재생된 뒤 포스트롤 광고가 재생되고 그대로 끝나는 그림이에요.": 본편 끝까지 포스트롤 여기서 끝나요
                - group "포스트롤 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 지면 편성 › 포스트롤 · 종료 후
          - listitem:
            - article "광고 항목과 순서":
              - heading "광고 항목과 순서" [level=4]
              - text: 지금 동작
              - paragraph: 구간에 넣은 소재 하나와 그 재생 설정(클릭 목적지, 스킵, 이미지 표시 시간)이에요. 목록 순서대로 재생되고, 마지막 항목이 끝나면 본편이 이어져요.
              - paragraph: 항목은 넣을 때 고른 소재 버전을 계속 써요. 한 항목이 끝나거나 건너뛰거나 오류가 나면 다음 항목으로 넘어가요.
              - figure:
                - img "한 구간 안의 광고 1, 2, 3이 차례로 재생된 뒤 본편이 이어지는 그림이에요.": 광고 구간 하나 1. 광고 2. 광고 3. 광고 본편
                - group "광고 항목과 순서 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 지면 편성 › 추가할 소재
      - region "소재":
        - heading "소재" [level=3]
        - list:
          - listitem:
            - article "소재":
              - heading "소재" [level=4]
              - text: 지금 동작
              - paragraph: 광고로 재생할 영상이나 이미지 파일과 그 이름·대체텍스트예요. 저장할 때마다 새 버전이 생기고 이전 버전은 남아요.
              - paragraph: MP4·WebM 영상과 JPEG·PNG·WebP·GIF 이미지를 쓸 수 있고, GIF는 이미지로 다뤄요. 이미 편성에 넣은 항목은 그때 고른 버전을 계속 써요.
              - figure:
                - img "소재 v1을 고쳐 저장하면 v2가 새로 생기고, 편성에 넣어 둔 항목은 v1을 그대로 쓰는 그림이에요.": v1 v2 편성에 넣은 항목 v1 그대로
                - group "소재 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 소재
          - listitem:
            - article "등록 방식":
              - heading "등록 방식" [level=4]
              - text: 지금 동작
              - paragraph: 외부 URL은 이미 공개된 파일 주소를 소재로 기록하고, 파일 업로드는 파일을 서버에 저장해요. 업로드한 파일의 형식은 서버가 파일 내용으로 판정해요.
              - paragraph: URL은 http(s)://로 시작하는 주소나 /로 시작하는 경로만 받아요. 업로드 한도는 기본 100 MiB이고, 업로드를 쓸 수 없는 설치에서는 파일 업로드를 고를 수 없어요.
              - figure:
                - img "두 줄 그림이에요. 외부 URL은 주소만 소재로 기록되고, 파일 업로드는 서버에 저장되어 형식을 확인한 뒤 소재가 돼요.": 외부 URL 주소만 기록 소재 파일 업로드 서버에 저장 형식 확인 소재
                - group "등록 방식 그림 조작":
                  - button "다시 보기"
              - paragraph: 관련 화면 · 소재 › 등록 방식
          - listitem:
            - article "대체텍스트":
              - heading "대체텍스트" [level=4]
              - text: 지금 동작
              - paragraph: 화면을 볼 수 없는 사용자에게 광고 내용을 전하는 짧은 설명이에요. 비워도 저장되지만, 그러면 보조기기 사용자에게 광고 내용이 전달되지 않아요.
              - paragraph: 이미지 광고에는 꼭 쓰기를 권해요. 1000자까지 쓸 수 있어요.
              - figure:
                - img "이미지 광고에 대체텍스트를 붙이면 화면 읽기 프로그램이 그 문장을 읽어 주는 그림이에요.": 이미지 광고 “봄 신상품 할인” 대체텍스트 화면 읽기 프로그램이 읽어요
                - group "대체텍스트 그림 조작":
                  - button "다시 보기"
              - paragraph: 관련 화면 · 소재 › 대체텍스트
          - listitem:
            - article "클릭 목적지 URL":
              - heading "클릭 목적지 URL" [level=4]
              - text: 지금 동작
              - paragraph: 광고 재생 중 보이는 "광고주 사이트" 링크가 새 탭으로 여는 주소예요. 소재가 아니라 광고 항목마다 정하고, 비우면 링크도 클릭 기록도 없어요.
              - paragraph: 링크를 눌러도 광고는 멈추지 않아요. 광고 화면 전체가 아니라 링크만 누를 수 있어요.
              - figure:
                - img "광고가 재생되는 동안 광고주 사이트 링크를 누르면 새 탭이 열리고 광고는 계속 재생되는 그림이에요.": 광고주 사이트 ↗ 광고 광고주 사이트 새 탭 광고는 계속 재생돼요
                - group "클릭 목적지 URL 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 지면 편성 › 클릭 목적지 URL
          - listitem:
            - article "이미지 · GIF 표시 시간":
              - heading "이미지 · GIF 표시 시간" [level=4]
              - text: 지금 동작
              - paragraph: 이미지 광고를 보여 주는 시간이에요. 이미지가 로드되고 페이지가 보이는 동안만 시간이 흐르고, 시간이 다 되면 완료로 기록돼요.
              - paragraph: 5초는 새 이미지 항목에 화면이 채워 넣는 값이에요. 서버와 플레이어에는 기본값이 없어서 비우면 저장할 수 없어요. 3600초까지 정할 수 있고, GIF 반복 횟수와는 상관없어요.
              - figure:
                - img "이미지 광고 아래 막대가 5초 동안 차오른 뒤 본편으로 넘어가는 그림이에요.": 이미지 광고 본편 표시 시간 5초
                - group "이미지 · GIF 표시 시간 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 지면 편성 › 이미지 · GIF 표시 (초)
          - listitem:
            - article "보관":
              - heading "보관" [level=4]
              - text: 지금 동작
              - paragraph: 소재를 새 편성에 더 쓰지 않게 하는 조치예요. 되돌릴 수 없고, 보관한 소재는 추가할 소재 목록에서 빠져요.
              - paragraph: 보관해도 노출이 바로 멈추지는 않아요. 이미 게시된 편성은 다음 게시 전까지 그 소재를 계속 재생하고, 그 소재가 든 초안은 저장·게시·미리보기가 거부돼요.
              - figure:
                - img "소재를 보관해도 게시본에서는 계속 재생되고, 그 소재가 든 초안은 저장과 게시가 막히는 그림이에요.": 소재 보관 게시본은 계속 재생 다음 게시 전까지 이 소재가 든 초안 저장·게시 거부
                - group "보관 그림 조작":
                  - button "다시 보기"
              - paragraph: 관련 화면 · 소재 › 상태
      - region "스킵":
        - heading "스킵" [level=3]
        - list:
          - listitem:
            - article "스킵 대기":
              - heading "스킵 대기" [level=4]
              - text: 지금 동작
              - paragraph: 광고가 재생을 시작한 뒤 건너뛰기 버튼을 누를 수 있을 때까지의 시간이에요. 대기 시간이 끝나야 버튼이 켜져요.
              - paragraph: 1~3600초 정수이고, 스킵을 켜면 1초로 채워져요. 이미지 광고는 표시 시간보다 짧아야 해요. 대기 시간이 광고 길이보다 길면 버튼은 끝까지 켜지지 않아요.
              - figure:
                - img "광고가 재생되는 동안 \"5초 후 건너뛰기\"가 1초씩 줄어든 뒤 \"광고 건너뛰기\" 버튼이 켜지는 그림이에요.": 5 4 3 2 1 초 후 건너뛰기 광고 건너뛰기 광고 스킵 대기 5초
                - group "스킵 대기 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 지면 편성 › 스킵 대기 (초)
          - listitem:
            - article "이 광고의 스킵":
              - heading "이 광고의 스킵" [level=4]
              - text: 지금 동작
              - paragraph: 광고 항목마다 건너뛰기를 허용할지 정해요. 건너뛰면 지금 광고 하나만 끝나고 같은 구간의 다음 광고로 넘어가요.
              - paragraph: 새 항목은 스킵 불가로 시작해요. 구간 전체를 건너뛰는 기능은 없고, 다음 광고의 대기 시간은 처음부터 다시 세요.
              - figure:
                - img "광고 A를 건너뛰면 A만 일찍 끝나고 광고 B와 C가 이어서 재생된 뒤 본편으로 돌아가는 그림이에요.": A 건너뜀 B C 본편 B의 대기 시간은 처음부터 다시 세요
                - group "이 광고의 스킵 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 지면 편성 › 이 광고의 스킵
      - region "편성 대상과 상속":
        - heading "편성 대상과 상속" [level=3]
        - list:
          - listitem:
            - article "적용 단위":
              - heading "적용 단위" [level=4]
              - text: 지금 동작
              - paragraph: 편성을 사이트 기본·게시판·분류·개별 영상 가운데 어디에 붙일지 정해요. 재생할 때는 영상 → 분류 → 게시판 → 사이트 순서로 찾아 가장 가까운 게시 편성 하나만 써요.
              - paragraph: 편성끼리 합치지 않아요. 분류 단계는 영상에 게시판과 분류가 모두 있을 때만 적용돼요. 독립 설치에서는 대상 ID를 직접 입력해요.
              - figure:
                - img "영상과 분류에는 편성이 없어 건너뛰고, 게시판 편성 B를 찾아 그것만 쓰는 그림이에요. 사이트 편성 A는 쓰지 않아요.": "사이트 게시판 분류 영상 게시 편성 A B 없음 없음 찾는 순서: 영상부터 위로 안 씀 B 사용 건너뜀 건너뜀"
                - group "적용 단위 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 지면 편성 › 적용 단위
          - listitem:
            - article "상위 설정 상속":
              - heading "상위 설정 상속" [level=4]
              - text: 지금 동작
              - paragraph: 이 대상에 직접 편성을 두지 않고 위 단계의 게시 편성을 따르는 방식이에요.
              - paragraph: 사이트 기본은 상속을 고를 수 없어요. "현재 게시 설정 출처"는 게시본 기준으로 실제 적용되는 단계를 보여 주고, 초안은 반영하지 않아요.
              - figure:
                - img "사이트 편성 A를 게시판, 분류, 영상이 차례로 물려받아 영상에서도 A가 재생되는 그림이에요.": 사이트 게시판 분류 영상 설정 A 상속 상속 상속 재생되는 편성 A A A A
                - group "상위 설정 상속 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 지면 편성 › 이 대상의 광고
          - listitem:
            - article "직접 편성 · 전체 대체":
              - heading "직접 편성 · 전체 대체" [level=4]
              - text: 지금 동작
              - paragraph: 이 대상의 광고 구간을 직접 정하고, 위 단계 편성과 합치지 않고 통째로 바꾸는 방식이에요. 구간 편집기는 이 방식에서만 보여요.
              - paragraph: 구간이 하나도 없는 직접 편성을 게시하면 광고 없는 편성이 적용돼요.
              - figure:
                - img "게시판이 사이트 편성 A 대신 직접 편성 B를 쓰고, 그 아래 분류와 영상은 B를 물려받는 그림이에요.": 사이트 게시판 분류 영상 설정 A B 상속 상속 재생되는 편성 A B B B
                - group "직접 편성 · 전체 대체 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 지면 편성 › 이 대상의 광고
          - listitem:
            - article "광고 비활성화 · 상속 중단":
              - heading "광고 비활성화 · 상속 중단" [level=4]
              - text: 지금 동작
              - paragraph: 이 대상에서 광고를 끄고, 위 단계 편성이 내려오는 것도 막아요. 게시해야 적용돼요.
              - paragraph: 흔히 "사용 안 함"이라고 부르는 설정이에요. 화면에서는 "광고 비활성화 · 상속 중단"을 고르고, 저장되는 값은 disabled예요.
              - figure:
                - img "게시판에서 광고를 비활성화하면 사이트 편성 A가 내려오지 못해 분류와 영상에도 광고가 없는 그림이에요.": 사이트 게시판 분류 영상 설정 A 비활성 상속 상속 재생되는 편성 A 없음 없음 없음
                - group "광고 비활성화 · 상속 중단 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 지면 편성 › 이 대상의 광고
          - listitem:
            - article "고정 영상 ID":
              - heading "고정 영상 ID" [level=4]
              - text: 지금 동작
              - paragraph: 편성·재생·통계가 영상을 구분하는 변하지 않는 식별자예요. 영상 주소가 바뀌어도 ID가 같으면 같은 영상으로 봐요.
              - paragraph: 1~128자예요. 미리보기와 재생 테스트도 이 ID로 편성을 찾아요.
              - figure:
                - img "주소가 다른 영상 두 개가 같은 영상 ID를 가지면 같은 편성과 같은 통계로 이어지는 그림이에요.": 주소 1 video-12 주소 2 video-12 같은 편성 같은 통계
                - group "고정 영상 ID 그림 조작":
                  - button "다시 보기"
              - paragraph: 관련 화면 · 지면 편성 › 고정 영상 ID, 플레이어 › 초기 설정 방법 › 영상 ID
              - paragraph:
                - text: 함께 보기 ·
                - link "설치 코드":
                  - /url: "#/help/player-install-snippet"
          - listitem:
            - article "영상 소속 연결":
              - heading "영상 소속 연결" [level=4]
              - text: 지금 동작
              - paragraph: 독립 설치에서 영상 ID가 어느 게시판·분류에 속하는지 기록해요. 기록이 없으면 그 영상은 영상과 사이트 단계 편성만 받아요.
              - paragraph: 영상 이름은 꼭 넣어야 하고, 분류를 넣으려면 게시판 ID도 필요해요. 새 재생 세션부터 적용돼요.
              - figure:
                - img "영상 ID를 게시판과 분류에 연결하면 그 게시판과 분류의 편성도 받을 수 있게 되는 그림이에요.": 영상 ID 게시판 분류 이제 게시판·분류 편성도 받아요
                - group "영상 소속 연결 그림 조작":
                  - button "다시 보기"
              - paragraph: 관련 화면 · 지면 편성 › 독립 설치 영상의 게시판·분류 연결
      - region "초안과 게시":
        - heading "초안과 게시" [level=3]
        - list:
          - listitem:
            - article "초안":
              - heading "초안" [level=4]
              - text: 지금 동작
              - paragraph: 대상별로 서버에 저장한 편집본이에요. 초안을 저장해도 재생에는 영향이 없고, 게시해야 반영돼요.
              - figure:
                - img "편집한 내용을 초안으로 저장해도 시청자 화면의 광고는 게시본 그대로인 그림이에요.": 편집 초안 시청자 화면 게시본 그대로 초안을 저장해도 재생은 바뀌지 않아요
                - group "초안 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 지면 편성 › 초안 저장
          - listitem:
            - article "초안 revision":
              - heading "초안 revision" [level=4]
              - text: 지금 동작
              - paragraph: 초안을 저장할 때마다 1씩 오르는 번호예요. 게시 버전과는 따로 세요.
              - paragraph: 저장하기 전에는 "저장 전 초안"이고, 처음 저장하면 r1이에요. 게시해도 revision은 바뀌지 않아요.
              - figure:
                - img "초안을 저장하면 r2가 r3으로 오르고 게시 v4는 그대로인 그림이에요.": r2 r3 게시 v4 그대로
                - group "초안 revision 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 지면 편성 › 저장된 초안 배지
          - listitem:
            - article "초안 충돌":
              - heading "초안 충돌" [level=4]
              - text: 지금 동작
              - paragraph: 다른 창이나 다른 운영자가 먼저 초안을 저장해 내가 불러온 revision이 낡으면 저장과 게시가 거부돼요. 지금 입력은 화면에 그대로 남아요.
              - paragraph: "\"서버 초안 다시 불러오기\"를 누르면 내 입력은 버려져요. 자동으로 다시 시도하지 않아요."
              - figure:
                - img "두 창이 같은 r2를 불러온 뒤 한 창이 r3으로 저장하면, 다른 창의 저장은 충돌로 거부되고 입력은 남는 그림이에요.": 창 1 r2 불러옴 창 2 r2 불러옴 r3 창 2 저장 충돌 창 1 저장 입력은 그대로 남아요
                - group "초안 충돌 그림 조작":
                  - button "다시 보기"
              - paragraph: 관련 화면 · 지면 편성 › 서버 초안 다시 불러오기
          - listitem:
            - article "게시":
              - heading "게시" [level=4]
              - text: 지금 동작
              - paragraph: 저장한 초안을 재생에 쓰는 편성으로 확정해요. 게시 뒤 새로 시작하는 재생부터 적용돼요.
              - paragraph: 이미 편성을 받은 재생은 받은 편성을 끝까지 써요(기본 2시간). 저장하지 않은 변경이 있으면 게시할 수 없고, 게시할 때 서버가 초안을 다시 검사해요.
              - figure:
                - img "게시 전에 시작한 재생은 이전 편성을 계속 쓰고, 게시 뒤 새로 시작한 재생부터 새 편성을 쓰는 그림이에요.": 재생 1 게시 전 시작 이전 편성 재생 2 게시 뒤 시작 새 편성
                - group "게시 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 지면 편성 › 저장한 초안 게시
          - listitem:
            - article "게시본과 게시 버전":
              - heading "게시본과 게시 버전" [level=4]
              - text: 지금 동작
              - paragraph: 게시할 때마다 1씩 오르는 그 대상 게시본의 번호예요. 가장 최근 게시본만 재생에 써요.
              - paragraph: 첫 게시는 v1이에요. 같은 초안을 두 번 게시해도 버전이 올라요. 게시본이 없으면 "게시본 없음"으로 보여요.
              - figure:
                - img "게시하면 게시본 v3 위에 v4가 쌓이고 재생이 v4로 옮겨 가는 그림이에요.": v3 v4 재생 v4
                - group "게시본과 게시 버전 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 지면 편성 › 게시 버전 배지
      - region "미리보기와 재생 테스트":
        - heading "미리보기와 재생 테스트" [level=3]
        - list:
          - listitem:
            - article "게시 전 미리보기":
              - heading "게시 전 미리보기" [level=4]
              - text: 지금 동작
              - paragraph: 편집 중인 초안을, 저장하기 전 내용까지 실제 광고 모듈로 재생해 봐요. 통계에는 기록하지 않아요.
              - paragraph: 게시판·분류는 영상 ID로 찾아요. 그래서 영상이 편집 중인 게시판에 속하지 않으면 편집 내용이 미리보기에 나오지 않을 수 있어요. 편성을 바꾸거나 다른 메뉴로 가면 멈추고, 다시 준비해야 해요.
              - figure:
                - img "두 줄 그림이에요. 미리보기에서 나온 재생 신호는 통계로 가지 않고, 재생 테스트에서 나온 신호만 통계에 쌓여요.": 미리보기 기록 안 함 통계 재생 테스트 + 0 1 2 3 통계
                - group "게시 전 미리보기 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 지면 편성 › 게시 전 미리보기
          - listitem:
            - article "게시본 재생 테스트":
              - heading "게시본 재생 테스트" [level=4]
              - text: 지금 동작
              - paragraph: 게시한 편성을 실제 서비스와 같은 수집 경로로 새 탭에서 재생해요. 재생 결과가 통계에 쌓여요.
              - paragraph: 저장하거나 게시하지 않은 변경은 반영되지 않아요. "기본 video로 재생"과 "Video.js로 재생" 가운데 고를 수 있어요.
              - figure:
                - img "두 줄 그림이에요. 미리보기에서 나온 재생 신호는 통계로 가지 않고, 재생 테스트에서 나온 신호만 통계에 쌓여요.": 미리보기 기록 안 함 통계 재생 테스트 + 0 1 2 3 통계
                - group "게시본 재생 테스트 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 지면 편성 › 게시본 재생 테스트
      - region "플레이어":
        - heading "플레이어" [level=3]
        - list:
          - listitem:
            - article "프리셋":
              - heading "프리셋" [level=4]
              - text: 지금 동작
              - paragraph: 플레이어 종류, 스킨, 테마, 광고 화면 설정을 이름 붙여 저장한 묶음이에요. 초안·게시 단계 없이 저장하면 바로 적용돼요.
              - paragraph: 적용되는 곳은 이 프리셋을 불러오는 재생 테스트 페이지와 미리보기예요. 이미 붙여 넣은 설치 코드에는 만든 시점의 값이 들어 있어서, 다시 복사해 붙여 넣어야 바뀌어요. 이름은 1~40자, 저장 프리셋은 20개까지예요. 다른 창에서 먼저 저장했으면 저장이 거부되고 입력은 그대로 남아요.
              - figure:
                - img "프리셋 하나를 저장하면 미리보기와 재생 테스트의 플레이어 색과 모서리가 함께 바뀌는 그림이에요.": 프리셋 저장 색 · 모서리 · 글꼴 미리보기 재생 테스트
                - group "프리셋 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 플레이어 › 프리셋
              - paragraph:
                - text: 함께 보기 ·
                - link "기본 프리셋":
                  - /url: "#/help/player-default-preset"
                - text: ","
                - link "설치 코드":
                  - /url: "#/help/player-install-snippet"
          - listitem:
            - article "기본 프리셋":
              - heading "기본 프리셋" [level=4]
              - text: 지금 동작
              - paragraph: 프리셋을 따로 고르지 않은 곳이 쓰는 프리셋이에요. 설치 코드 생성기와 재생 테스트에서도 먼저 선택돼요.
              - paragraph: 처음에는 내장 프리셋 "기본"이에요. "기본"은 패키지 기본값 그대로라 고치거나 지울 수 없고 복제만 돼요. 기본으로 지정한 프리셋을 지우면 "기본"으로 돌아가요.
              - figure:
                - img "프리셋을 고르지 않은 페이지가 기본 프리셋을 쓰고, 기본 프리셋을 지우면 내장 \"기본\"으로 돌아가는 그림이에요.": 프리셋을 고르지 않은 곳 내 프리셋 기본 프리셋 내장 “기본” 지우면
                - group "기본 프리셋 그림 조작":
                  - button "다시 보기"
              - paragraph: 관련 화면 · 플레이어 › 프리셋 › 기본으로 지정
          - listitem:
            - article "플레이어 종류":
              - heading "플레이어 종류" [level=4]
              - text: 지금 동작
              - paragraph: Video.js는 스킨과 테마를 입힐 수 있는 플레이어이고, 기본 video는 브라우저 기본 컨트롤을 써요.
              - paragraph: 기본 video에는 스킨 테마가 적용되지 않아요. 광고 불러오기·멈춤 시간 제한은 기본 video에서만 정하고, Video.js의 광고 편성 요청 시간 제한은 5초로 고정이에요.
              - figure:
                - img "같은 영상에 Video.js는 강조색이 들어간 스킨 컨트롤을, 기본 video는 브라우저 기본 컨트롤을 씌우는 그림이에요.": Video.js · 스킨 테마 기본 video · 브라우저 컨트롤
                - group "플레이어 종류 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 플레이어 › 프리셋 편집 › 플레이어 종류
          - listitem:
            - article "스킨":
              - heading "스킨" [level=4]
              - text: 지금 동작
              - paragraph: Video.js 플레이어의 모양 묶음이에요. 기본과 뉴트럴 가운데 고르고, 스킨마다 불러오는 CSS·JS 파일이 달라 설치 코드도 달라져요.
              - paragraph: 기본은 모서리가 28px로 둥글고, 뉴트럴은 12px에 테두리가 조금 진해요. compat·scaffold 스킨은 준비 중이에요.
              - figure:
                - img "같은 플레이어가 기본 스킨에서는 모서리가 크게, 뉴트럴 스킨에서는 작게 그려지는 그림이에요.": 기본 · 모서리 28px 뉴트럴 · 모서리 12px
                - group "스킨 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 플레이어 › 프리셋 편집 › 스킨
          - listitem:
            - article "테마 속성":
              - heading "테마 속성" [level=4]
              - text: 지금 동작
              - paragraph: Video.js가 공개한 스킨 설정값이에요. 프리셋에서는 강조색, 강조 글자색, 테두리 색, 모서리, 글꼴, 화면 채우기, 크기 기준 7가지를 정해요.
              - paragraph: 비운 항목은 스킨 기본값을 써요. 공개된 8가지 가운데 채우기 위치는 프리셋에서 정하지 않아요. 플레이어 글꼴을 바꾸면 광고 화면 글꼴도 따라가요.
              - figure:
                - img "테마 속성 묶음이 플레이어에 들어가면 컨트롤 색과 모서리가 바뀌는 그림이에요.": 테마 속성 7가지 컨트롤 색과 모서리
                - group "테마 속성 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 플레이어 › 프리셋 편집 › 스킨 테마
              - paragraph:
                - text: 함께 보기 ·
                - link "강조색":
                  - /url: "#/help/player-accent-color"
                - text: ","
                - link "화면 채우기":
                  - /url: "#/help/player-object-fit"
          - listitem:
            - article "강조색":
              - heading "강조색" [level=4]
              - text: 지금 동작
              - paragraph: 진행 막대 채움, 강조 버튼, 메뉴 선택에 쓰는 색이에요. 강조 글자색은 강조색 위에 놓이는 글자와 아이콘 색이에요.
              - paragraph: 강조색을 비우면 스킨 기본값인 흰색이에요. 강조색과 강조 글자색의 대비가 4.5:1보다 낮으면 경고하지만 저장은 돼요. 강조 글자색을 비우면 브라우저가 대비되는 색을 고르는데, 이 기능이 없는 브라우저는 검정을 써요. 그래서 강조색을 정했다면 강조 글자색도 지정해 주세요.
              - figure:
                - img "강조색과 모서리 값을 넣으면 플레이어의 진행 막대·버튼 색과 모서리가 바뀌는 그림이에요.": 비움 · 스킨 기본 강조색 지정
                - group "강조색 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 플레이어 › 프리셋 편집 › 강조색, 강조 글자색
          - listitem:
            - article "화면 채우기":
              - heading "화면 채우기" [level=4]
              - text: 지금 동작
              - paragraph: 영상 비율이 플레이어와 다를 때 맞춤은 영상 전체가 보이고 빈 곳이 생겨요. 채움은 빈 곳 없이 가장자리가 잘려요.
              - paragraph: 전체화면에서는 항상 맞춤이에요. 광고 소재는 이 설정과 상관없이 맞춤으로 보여요.
              - figure:
                - img "세로 틀 안에서 맞춤은 위아래에 빈 곳이 생기고, 채움은 양옆이 잘리는 그림이에요.": 맞춤 · 빈 곳 채움 · 잘림
                - group "화면 채우기 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 플레이어 › 프리셋 편집 › 화면 채우기
          - listitem:
            - article "광고 화면":
              - heading "광고 화면" [level=4]
              - text: 지금 동작
              - paragraph: 광고가 재생될 때 본편 위에 덮이는 층이에요. 광고 표시, 건너뛰기 버튼, 남은 시간, 광고주 링크, 음량이 있어요.
              - paragraph: 프리셋에서는 건너뛰기·대기·시간 문구, 문구 언어, 음량 막대 색, 건너뛰기 버튼 모서리, 글자 크기(11~18px, 기본 13px)를 정해요. 폭 280px 이하에서는 글자가 11px로 고정돼요. 광고 대체텍스트는 소재마다 정하고 프리셋에서는 정하지 않아요.
              - figure:
                - img "본편 위에 광고 화면이 덮이고, 건너뛰기 버튼이 대기 시간을 센 뒤 켜지는 그림이에요.": 5 4 3 2 1 초 후 건너뛰기 광고 건너뛰기 광고 본편 위에 덮이는 광고 화면
                - group "광고 화면 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 플레이어 › 프리셋 편집 › 광고 화면
              - paragraph:
                - text: 함께 보기 ·
                - link "광고 문구 언어":
                  - /url: "#/help/player-ad-language"
                - text: ","
                - link "대체텍스트":
                  - /url: "#/help/alt-text"
                - text: ","
                - link "스킵 대기":
                  - /url: "#/help/skip-offset"
          - listitem:
            - article "광고 문구 언어":
              - heading "광고 문구 언어" [level=4]
              - text: 지금 동작
              - paragraph: 광고 화면의 기본 문구를 한국어로 쓸지 영어로 쓸지 정해요. 직접 입력한 문구가 있으면 그 문구가 먼저예요.
              - paragraph: 비우면 플레이어를 둘러싼 페이지의 lang을 따르고, lang이 없으면 영어로 나와요. 설치할 때 페이지에 lang="ko"가 있는지 확인해 주세요.
              - figure:
                - img "lang이 없는 페이지에서는 \"Skip ad\", lang=\"ko\"인 페이지에서는 \"광고 건너뛰기\"로 나오는 그림이에요.": lang 없음 Skip ad 영어 lang="ko" 광고 건너뛰기 한국어
                - group "광고 문구 언어 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 플레이어 › 프리셋 편집 › 광고 문구 언어
          - listitem:
            - article "설치 코드":
              - heading "설치 코드" [level=4]
              - text: 지금 동작
              - paragraph: 프리셋, 영상 ID, 본편 주소, 미디어 형식을 고르면 만들어지는 HTML 코드예요. 관리자와 같은 사이트의 페이지에 붙여 넣어야 광고 편성을 받아요.
              - paragraph: 코드에는 만든 시점의 프리셋 값이 들어가요. 프리셋을 바꾸면 코드를 다시 복사해 붙여 넣어야 해요. 이 코드로 재생하면 실제 통계에 기록돼요. 파일 경로는 /로 시작하는 경로나 전체 주소여야 해요.
              - figure:
                - img "파일 준비, 스타일·스크립트 넣기, 플레이어 배치, 영상 ID로 편성 연결, 재생 확인 순서로 설치하는 그림이에요.": 파일 준비 스타일·스크립트 플레이어 배치 영상 ID 연결 재생 확인
                - group "설치 코드 그림 조작":
                  - button "다시 보기"
              - paragraph: 관련 화면 · 플레이어 › 초기 설정 방법 › 설치 코드
              - paragraph:
                - text: 함께 보기 ·
                - link "고정 영상 ID":
                  - /url: "#/help/fixed-video-id"
                - text: ","
                - link "프리셋":
                  - /url: "#/help/player-preset"
                - text: ","
                - link "미디어 형식":
                  - /url: "#/help/player-media-engine"
          - listitem:
            - article "미디어 형식":
              - heading "미디어 형식" [level=4]
              - text: 지금 동작
              - paragraph: 본편 파일 형식과 재생 엔진이에요. MP4는 두 플레이어 모두, HLS는 Video.js에서만 고를 수 있어요.
              - paragraph: HLS-SPF는 Video.js 자체 엔진으로, HLS-hls.js는 hls.js 엔진으로 재생해요.
              - figure:
                - img "MP4는 Video.js와 기본 video 모두로, HLS 파일은 Video.js의 두 엔진 가운데 하나로 재생되는 그림이에요.": 본편 파일 MP4 Video.js · 기본 video HLS 파일 .m3u8 Video.js만 HLS-SPF · HLS-hls.js
                - group "미디어 형식 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 플레이어 › 초기 설정 방법 › 미디어
      - region "통계":
        - heading "통계" [level=3]
        - list:
          - listitem:
            - article "시작":
              - heading "시작" [level=4]
              - text: 지금 동작
              - paragraph: 광고가 실제로 재생을 시작한 횟수예요. 완료율과 클릭률은 이 수로 나눠요.
              - paragraph: 영상은 광고 재생이 시작될 때, 이미지는 로드된 뒤 처음 보일 때 세요. 자동 재생이 막혀 시청자가 누르지 않으면 세지 않아요. 수집하는 기록은 시작·완료·스킵·클릭·오류·중단 여섯 가지이고 노출은 없어서, 시작이 노출 자리를 대신해요.
              - figure:
                - img "광고 재생이 세 번 시작되면 시작 수가 0에서 3까지 하나씩 오르는 그림이에요.": 광고 재생 시작 0 1 2 3 시작
                - group "시작 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 리포트 › 기본 통계
          - listitem:
            - article "완료와 완료율":
              - heading "완료와 완료율" [level=4]
              - text: 지금 동작
              - paragraph: 완료는 시작한 광고 가운데 끝까지 재생된 수예요. 완료율은 완료 ÷ 시작이에요.
              - paragraph: 영상은 광고가 끝났을 때, 이미지는 표시 시간이 다 됐을 때 완료예요. 건너뛰거나 오류·중단으로 끝나면 완료가 아니에요. 시작이 0이면 완료율은 "—"로 보여요.
              - figure:
                - img "시작 10칸 가운데 7칸이 끝까지 재생되어 완료율 70%가 되는 그림이에요.": 시작 완료 완료 7 ÷ 시작 10 = 완료율 70%
                - group "완료와 완료율 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 리포트 › 기본 통계
          - listitem:
            - article "클릭":
              - heading "클릭" [level=4]
              - text: 지금 동작
              - paragraph: 시작한 광고에서 "광고주 사이트" 링크를 누른 횟수의 합계예요. 한 광고에서 여러 번 누르면 모두 세요.
              - paragraph: 클릭 목적지 URL이 없는 광고는 클릭을 받지 않아요.
              - figure:
                - img "시작 10칸 가운데 한 광고에서 링크를 두 번, 다른 광고에서 한 번 눌러요. 클릭은 3이고, 링크를 누른 시작은 2개예요.": 시작 링크를 누른 시작 3번째 칸 2번 + 7번째 칸 1번 클릭 3
                - group "클릭 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 리포트 › 기본 통계
          - listitem:
            - article "클릭률":
              - heading "클릭률" [level=4]
              - text: 지금 동작
              - paragraph: 링크를 한 번 이상 누른 시작 수 ÷ 시작 수예요. 클릭 횟수 합계로 나누지 않아요.
              - paragraph: 업계에서 흔히 쓰는 CTR(클릭 ÷ 노출)과 분모가 달라요. 시작이 0이면 "—"로 보여요.
              - figure:
                - img "시작 10칸 가운데 한 광고에서 링크를 두 번, 다른 광고에서 한 번 눌러요. 클릭은 3이고, 링크를 누른 시작은 2개예요. 그래서 클릭률은 2 ÷ 10 = 20%예요.": 시작 링크를 누른 시작 클릭 3번이어도 누른 시작은 2 2 ÷ 시작 10 = 클릭률 20%
                - group "클릭률 그림 조작":
                  - button "일시정지"
                  - button "다시 보기"
              - paragraph: 관련 화면 · 리포트 › 기본 통계
          - listitem:
            - article "조회 조건과 CSV":
              - heading "조회 조건과 CSV" [level=4]
              - text: 지금 동작
              - paragraph: 지금 조회 조건과 같은 결과를 행 단위 CSV 파일로 내려받아요. 조건을 바꾸면 이전 결과가 지워지니 다시 조회해 주세요.
              - paragraph: 광고·영상·게시판 ID는 정확히 같아야 걸려요. 스킵은 건너뛰어 끝난 시작 수, 오류는 오류가 한 번이라도 난 시도 수이고, 중단은 세지 않아요. 파일 이름은 ads-시작일-종료일.csv이고 합계 행은 없어요.
              - figure:
                - img "조회 조건을 정해 통계를 조회하면 결과 표가 나오고, 같은 내용을 CSV 파일로 내려받는 그림이에요.": 조회 조건 기간 · ID 결과 표 CSV 합계 행 없음
                - group "조회 조건과 CSV 그림 조작":
                  - button "다시 보기"
              - paragraph: 관련 화면 · 리포트 › 기본 통계 › 현재 조건 CSV 다운로드
      - region "캠페인과 승인":
        - heading "캠페인과 승인" [level=3]
        - list:
          - listitem:
            - article "광고주":
              - heading "광고주" [level=4]
              - text: 목업
              - paragraph: 캠페인 위의 최상위 단위예요. 지금은 캠페인 목업 화면의 설명 문구로만 보이고, 광고주를 관리하는 화면은 아직 없어요.
              - figure:
                - img "광고주 하나 아래 캠페인 두 개가 이어지는 그림이에요.": 광고주 캠페인 1 캠페인 2
                - group "광고주 그림 조작":
                  - button "다시 보기"
              - paragraph: 관련 화면 · 캠페인(목업)
          - listitem:
            - article "캠페인":
              - heading "캠페인" [level=4]
              - text: 목업
              - paragraph: 광고주와의 계약 단위예요. 실제 노출 조건은 캠페인 안의 집행에서 정해요. 지금은 목업 화면이라 저장되지 않아요.
              - figure:
                - img "캠페인 계약 기간 안에 집행 두 개가 들어가고, 집행에 소재가 붙는 그림이에요.": 캠페인 계약 기간 집행 1 집행 2 소재
                - group "캠페인 그림 조작":
