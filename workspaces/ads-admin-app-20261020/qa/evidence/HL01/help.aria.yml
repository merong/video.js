              - heading "집행 상태" [level=4]
              - text: 목업
              - paragraph: 집행의 진행 단계를 초안, 승인 대기, 예정, 진행, 일시중지, 종료, 미달 종료, 반려, 보관 9가지로 나눠요. 지금은 캠페인·대시보드 목업에서만 이 뜻으로 써요.
              - paragraph: "실제 화면에서는 같은 색 배지를 다른 뜻으로 빌려 쓰기도 해요. 소재의 \"사용 가능\", 지면 편성의 \"게시 v{n}\"은 집행 상태가 아니에요."
              - figure:
                - img "집행 하나가 초안, 승인 대기, 예정, 진행, 종료로 넘어가고, 갈림길로 일시중지, 반려, 미달 종료가 있는 그림이에요.": 초안 승인 대기 예정 진행 종료 갈림길 일시중지 반려 미달 종료
                - group "집행 상태 그림 조작":
                  - button "다시 보기"
              - paragraph: 관련 화면 · 캠페인·대시보드(목업)
          - listitem:
            - article "노출":
              - heading "노출" [level=4]
              - text: 준비 중
              - paragraph: 광고를 정해진 시간 이상 보여 준 횟수예요. 명세상 영상은 2초, 이미지는 1초 이상 보이면 노출이에요. 지금은 노출을 수집하지 않고, 목업 화면의 노출 숫자는 예시예요.
              - figure:
                - img "광고 재생이 2초를 넘는 순간 노출이 1 오르는 그림이에요. 지금은 수집하지 않는 지표예요.": 광고 재생 2초 지남 노출 +1 지금은 수집 안 함
                - group "노출 그림 조작":
