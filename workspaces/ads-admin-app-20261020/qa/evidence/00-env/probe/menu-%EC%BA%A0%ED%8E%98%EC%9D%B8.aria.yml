- main "캠페인":
  - region "캠페인":
    - heading "캠페인" [level=1]
    - text: 목업 · 아직 동작하지 않아요
    - paragraph: 광고주와의 계약 단위예요. 실제 노출 조건은 캠페인 안의 집행에서 정해요.
    - button "캠페인 만들기" [disabled]
    - text: 목업 화면이라 아직 동작하지 않아요.
    - group "상태별 보기":
      - button "전체5" [pressed]
      - button "진행3"
      - button "승인 대기1"
      - button "미달 종료1"
    - heading "캠페인 5개" [level=2]
    - text: 진도 막대의 세로 눈금은 지금까지의 기대 진도예요.
    - region "캠페인 목록 (예시)":
