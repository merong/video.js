- main "플레이어":
  - region "플레이어":
    - heading "플레이어" [level=1]
    - paragraph: 플레이어 종류, 스킨 테마, 광고 화면 설정을 프리셋으로 저장하고, 설치 방법과 옵션을 확인해요.
    - navigation "플레이어 화면":
      - link "프리셋 목록":
        - /url: "#/players"
      - link "초기 설정 방법":
        - /url: "#/players/setup"
      - link "옵션 설명":
        - /url: "#/players/options"
    - heading "초기 설정 방법" [level=2]
    - region "설치 순서":
      - heading "설치 순서" [level=2]
      - list:
        - listitem:
          - strong: 파일 준비.
          - text: 저장소 루트에서 광고 모듈과 Video.js를 빌드하고 결과를 관리자의
          - code: public/assets/
          - text: 에 복사해요. 빌드는 개발 PC에서 하고 결과 파일만 서버에 올려요. 명령은
          - code: public/examples/README.md
          - text: 에 있어요.
        - listitem:
          - strong: 페이지에 스타일·스크립트 넣기.
          - text: 아래 설치 코드 맨 위의 스타일과 스크립트가 필요해요. 관리자와 같은 사이트(같은 출처) 페이지에만 붙여 넣을 수 있어요. 다른 도메인에서는 편성을 받지 못하고, 파일을 직접 열지 말고 웹 서버로 열어야 해요.
        - listitem:
          - strong: 플레이어 배치.
          - text: 설치 코드의 플레이어 부분을 영상이 보일 자리에 둬요. 파일 주소는 전체 주소나 /로 시작하는 경로여야 해요. 광고 문구 언어를 비운 프리셋은 페이지의 lang을 따르니 <html lang>을 확인해 주세요.
        - listitem:
          - strong: 영상 ID로 편성 연결.
          - text: 설치 코드의 영상 ID가 지면 편성의 영상 ID와 같아야 광고가 붙어요. 영상을 등록하면 게시판·분류 편성도 적용돼요.
        - listitem:
          - strong: 재생 확인.
          - text: 설치 코드로 재생하면 실제 통계에 기록돼요. 기록 없이 확인하려면 지면 편성의 미리보기를 써 주세요.
    - region "설치 코드 만들기":
      - heading "설치 코드 만들기" [level=2]
      - link "설치 코드 도움말":
        - /url: "#/help/player-install-snippet"
        - text: "?"
      - text: 프리셋
      - combobox "프리셋":
        - option "기본"
        - option "QA Video.js 중립 v2 (기본 프리셋)" [selected]
        - option "기본 복사본"
        - option "QA Video.js 중립 v2 복사본"
      - text: 저장한 값으로 코드를 만들어요. 처음에는 기본 프리셋이 선택돼요.
      - link "프리셋 도움말":
        - /url: "#/help/player-preset"
        - text: "?"
      - text: 영상 ID
      - textbox "영상 ID"
      - text: 편성과 통계에 쓰는 고정 영상 ID예요. 128자 이내예요.
      - link "고정 영상 ID 도움말":
        - /url: "#/help/fixed-video-id"
        - text: "?"
      - text: 본편 URL
      - textbox "본편 URL": http://127.0.0.1:18781/demo-media/grok-20261018/content-scene-01.mp4
      - text: 기본값은 재생 테스트와 같은 데모 본편이에요. 실제 영상 주소로 바꿔 주세요.
      - group "미디어":
        - text: 미디어
        - radio "MP4" [checked]
        - text: MP4
        - radio "HLS · SPF"
        - text: HLS · SPF
        - radio "HLS · hls.js"
        - text: HLS · hls.js HLS는 Video.js 플레이어에서만 쓸 수 있어요.
        - link "미디어 형식 도움말":
          - /url: "#/help/player-media-engine"
          - text: "?"
      - status: 고정 영상 ID를 입력해 주세요.