<!-- @dsCard group="동작" height=470 subtitle="기본·작은 크기와 밀집 툴바, 초점을 받는 비활성" -->
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../fonts.css" />
    <link rel="stylesheet" href="../../tokens.css" />
    <link rel="stylesheet" href="../bundle.css" />
    <title>Button</title>
  </head>
  <body>
    <div class="sa-pv">
      <span class="sa-cap">기본 · 높이 36px</span>
      <div class="sa-row">
        <button class="sa-btn is-primary" type="button">승인 요청</button
        ><button class="sa-btn is-lime" type="button">
          <svg class="sa-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" /></svg>집행 만들기</button
        ><button class="sa-btn" type="button">초안 저장</button
        ><button class="sa-btn" type="button" disabled>승인</button>
      </div>
      <span class="sa-cap">작은 크기 · 30px / 밀집 툴바 · 32px, 28px</span>
      <div class="sa-row">
        <button class="sa-btn is-sm is-primary" type="button">승인 요청</button
        ><button class="sa-btn is-sm" type="button">초안 저장</button>
        <span class="sa-dense sa-row" style="margin-left: 16px"
          ><button class="sa-btn" type="button">리포트</button
          ><button class="sa-btn is-lime" type="button">
            <svg class="sa-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" /></svg>집행 만들기</button
          ><button class="sa-btn is-sm" type="button">CSV</button></span
        >
      </div>
      <span class="sa-cap">위험 동작 / 비활성 이유</span>
      <div class="sa-row" style="align-items: start">
        <button class="sa-btn" type="button">보완 요청</button
        ><button class="sa-btn is-danger" type="button">반려</button
        ><span class="sa-btn-why"
          ><button class="sa-btn is-primary" type="button" aria-disabled="true" aria-describedby="why1">승인</button
          ><span class="sa-help" id="why1">자기 제출 건은 승인할 수 없어요.</span></span
        >
      </div>
      <span class="sa-cap">초점을 받는 비활성 · aria-disabled (Tab으로 와서 이유를 들음)</span>
      <div class="sa-row" style="align-items: start">
        <span class="sa-btn-why"
          ><button class="sa-btn" type="button" aria-disabled="true" aria-describedby="why2">
            <svg class="sa-ico" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M9 3h4v4M13 3 7.5 8.5M11 9.5V13H3V5h3.5" /></svg
            >데모에서 열기</button
          ><span class="sa-help" id="why2">저장하지 않은 입력이 있어요. 저장하면 데모에서 열 수 있어요.</span></span
        ><span class="sa-btn-why"
          ><a class="sa-btn" role="link" tabindex="0" aria-disabled="true" aria-describedby="why3"
            ><svg class="sa-ico" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M9 3h4v4M13 3 7.5 8.5M11 9.5V13H3V5h3.5" /></svg
            >데모에서 열기</a
          ><span class="sa-help" id="why3">새 프리셋은 저장한 뒤 데모에서 열 수 있어요.</span></span
        >
      </div>
      <span class="sa-cap">같은 모양 · disabled / aria-disabled (종류와 상관없이 회색)</span>
      <div class="sa-row">
        <button class="sa-btn is-lime" type="button" disabled>집행 만들기</button
        ><button class="sa-btn is-lime" type="button" aria-disabled="true">집행 만들기</button
        ><button class="sa-btn is-danger" type="button" aria-disabled="true">반려</button
        ><button class="sa-btn is-sm" type="button" aria-disabled="true">CSV</button>
      </div>
    </div>
  </body>
</html>
