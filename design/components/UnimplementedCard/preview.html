<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../fonts.css" />
    <link rel="stylesheet" href="../../tokens.css" />
    <link rel="stylesheet" href="../bundle.css" />
    <title>UnimplementedCard</title>
  </head>
  <body>
    <div class="sa-pv" style="max-width: 640px">
      <section class="sa-card is-unbuilt" aria-labelledby="u1">
        <span class="sa-mock">아직 만들지 않은 화면</span>
        <h2 class="sa-card-title" id="u1">지면 편성</h2>
        <p class="sa-body">영상과 게시판마다 광고가 나갈 위치와 횟수를 정하는 화면이에요.</p>
        <p class="sa-small">기획 문서 <code class="sa-code">.agents/plans/ads-admin-v2-spec.md</code></p>
      </section>
      <section class="sa-card is-flush sa-dense">
        <div class="sa-scroll">
          <table class="sa-table">
            <caption>
              광고 요청
            </caption>
            <thead>
              <tr>
                <th scope="col">제목</th>
                <th scope="col">회원</th>
                <th scope="col">상태</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="sa-empty" colspan="3"><b>조건에 맞는 요청이 없어요</b>필터를 바꿔 보세요.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </body>
</html>
