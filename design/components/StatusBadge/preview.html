<!-- @dsCard group="상태" height=90 subtitle="아홉 가지 상태, 사이트 적용, 옮김" -->
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../fonts.css" />
    <link rel="stylesheet" href="../../tokens.css" />
    <link rel="stylesheet" href="../bundle.css" />
    <title>StatusBadge</title>
  </head>
  <body>
    <div class="sa-pv">
      <div class="sa-row">
        <span class="sa-badge" data-st="draft">초안</span><span class="sa-badge" data-st="pending">승인 대기</span
        ><span class="sa-badge" data-st="scheduled">예정</span><span class="sa-badge" data-st="active">진행</span
        ><span class="sa-badge" data-st="paused">일시중지</span><span class="sa-badge" data-st="done">종료</span
        ><span class="sa-badge" data-st="under">미달 종료</span><span class="sa-badge" data-st="rejected">반려</span
        ><span class="sa-badge" data-st="archived">보관</span>
      </div>
      <div class="sa-row">
        <span class="sa-badge is-site">사이트 적용</span><span class="sa-badge is-moved">중립 스킨에서 옮김</span
        ><span class="sa-badge">내장</span>
      </div>
    </div>
  </body>
</html>
