<!-- @dsCard group="데이터" height=360 width=760 subtitle="14일 추이와 표 보기" -->
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../fonts.css" />
    <link rel="stylesheet" href="../../tokens.css" />
    <link rel="stylesheet" href="../bundle.css" />
    <title>TrendChart</title>
  </head>
  <body>
    <div class="sa-pv">
      <div class="sa-card" data-trend>
        <div class="sa-card-h">
          <h3 class="sa-card-title">최근 14일 성과</h3>
          <div class="sa-chips" role="group" aria-label="추이 지표">
            <button class="sa-chip" type="button" data-metric="imp" aria-pressed="true">노출</button
            ><button class="sa-chip" type="button" data-metric="clk" aria-pressed="false">클릭</button
            ><button class="sa-chip" type="button" data-metric="table" aria-pressed="false">표</button>
          </div>
        </div>
        <div class="sa-chart"></div>
        <div class="sa-scroll" hidden></div>
      </div>
    </div>
    <script>
      var dates = [
        '10.07',
        '10.08',
        '10.09',
        '10.10',
        '10.11',
        '10.12',
        '10.13',
        '10.14',
        '10.15',
        '10.16',
        '10.17',
        '10.18',
        '10.19',
        '10.20',
      ];
      var imp = [40210, 42380, 41050, 46120, 51040, 51830, 42900, 43870, 45410, 47390, 49060, 54580, 56590, 31320];
      var clk = [852, 889, 851, 986, 1092, 1119, 906, 924, 951, 1011, 1043, 1166, 1199, 661];
      var metrics = {
        imp: { vals: imp, ticks: [0, 20000, 40000, 60000], name: '노출' },
        clk: { vals: clk, ticks: [0, 500, 1000, 1500], name: '클릭' },
      };
      function fmt(n) {
        return Math.round(n).toLocaleString('ko-KR');
      }
      function lineChart(m) {
        var vals = m.vals,
          ticks = m.ticks,
          W = 680,
          H = 240,
          p = { l: 56, r: 24, t: 24, b: 34 },
          n = vals.length,
          yMax = ticks[ticks.length - 1];
        function x(i) {
          return p.l + (i * (W - p.l - p.r)) / (n - 1);
        }
        function y(v) {
          return p.t + (1 - v / yMax) * (H - p.t - p.b);
        }
        var solid = vals
          .slice(0, n - 1)
          .map(function (v, i) {
            return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1);
          })
          .join(' ');
        var s =
          '<svg viewBox="0 0 ' +
          W +
          ' ' +
          H +
          '" role="img" aria-label="최근 14일 일별 ' +
          m.name +
          '. 어제 ' +
          fmt(vals[n - 2]) +
          ', 오늘 15시까지 ' +
          fmt(vals[n - 1]) +
          ' 집계 중">';
        ticks.forEach(function (t) {
          s +=
            '<line class="gd" x1="' +
            p.l +
            '" x2="' +
            (W - p.r) +
            '" y1="' +
            y(t) +
            '" y2="' +
            y(t) +
            '"/><text class="tx" x="' +
            (p.l - 10) +
            '" y="' +
            (y(t) + 4) +
            '" text-anchor="end">' +
            fmt(t) +
            '</text>';
        });
        dates.forEach(function (d, i) {
          if (i % 2 === 0 || i === n - 1)
            s += '<text class="tx" x="' + x(i) + '" y="' + (H - 10) + '" text-anchor="middle">' + d + '</text>';
        });
        s +=
          '<path class="ar" d="' + solid + ' L' + x(n - 2).toFixed(1) + ' ' + y(0) + ' L' + x(0) + ' ' + y(0) + ' Z"/>';
        s += '<path class="ln" d="' + solid + '"/>';
        s +=
          '<path class="ln ln-part" d="M' +
          x(n - 2).toFixed(1) +
          ' ' +
          y(vals[n - 2]).toFixed(1) +
          ' L' +
          x(n - 1).toFixed(1) +
          ' ' +
          y(vals[n - 1]).toFixed(1) +
          '"/>';
        s +=
          '<circle class="pt" cx="' +
          x(n - 2) +
          '" cy="' +
          y(vals[n - 2]) +
          '" r="4"/><text class="tx-b" x="' +
          x(n - 2) +
          '" y="' +
          (y(vals[n - 2]) - 10) +
          '" text-anchor="middle">' +
          fmt(vals[n - 2]) +
          '</text>';
        s +=
          '<circle class="pt-open" cx="' +
          x(n - 1) +
          '" cy="' +
          y(vals[n - 1]) +
          '" r="4"/><text class="tx" x="' +
          (x(n - 1) - 8) +
          '" y="' +
          (y(vals[n - 1]) + 20) +
          '" text-anchor="end">집계 중</text>';
        return s + '</svg>';
      }
      function trendTable() {
        var t =
          '<table class="sa-table"><caption>일별 노출·클릭 (10.20은 15시까지 집계)</caption><thead><tr><th scope="col">날짜</th><th scope="col" class="num">노출</th><th scope="col" class="num">클릭</th><th scope="col" class="num">클릭률</th></tr></thead><tbody>';
        dates.forEach(function (d, i) {
          t +=
            '<tr><td class="sa-num">' +
            d +
            '</td><td class="num">' +
            fmt(imp[i]) +
            '</td><td class="num">' +
            fmt(clk[i]) +
            '</td><td class="num">' +
            ((clk[i] / imp[i]) * 100).toFixed(2) +
            '%</td></tr>';
        });
        return t + '</tbody></table>';
      }
      document.querySelectorAll('[data-trend]').forEach(function (box) {
        var host = box.querySelector('.sa-chart'),
          tw = box.querySelector('.sa-scroll');
        tw.innerHTML = trendTable();
        function set(k) {
          box.querySelectorAll('[data-metric]').forEach(function (b) {
            b.setAttribute('aria-pressed', String(b.getAttribute('data-metric') === k));
          });
          host.hidden = k === 'table';
          tw.hidden = k !== 'table';
          if (metrics[k]) host.innerHTML = lineChart(metrics[k]);
        }
        box.querySelectorAll('[data-metric]').forEach(function (b) {
          b.addEventListener('click', function () {
            set(b.getAttribute('data-metric'));
          });
        });
        set('imp');
      });
    </script>
  </body>
</html>
