<!-- @dsCard group="알림" height=270 subtitle="기본, 주의, 막힘, 동작 버튼" -->
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../fonts.css" />
    <link rel="stylesheet" href="../../tokens.css" />
    <link rel="stylesheet" href="../bundle.css" />
    <title>Note</title>
  </head>
  <body>
    <div class="sa-pv" style="max-width: 520px">
      <p class="sa-note" role="note">
        <span><b>같은 자리 1건</b> · 같은 기간 미드롤에 승인된 집행이 1건 있어요. 가중치에 따라 번갈아 나가요.</span>
      </p>
      <p class="sa-note is-warn" role="note">
        <span><b>버전 주의</b> · 쪽지는 그누보드 쪽지 테이블에 직접 써요. 실패해도 요청 처리는 그대로 돼요.</span>
      </p>
      <div class="sa-note has-actions" role="note">
        <span
          ><b>프리셋 2개를 옮겼어요</b> · 중립 스킨 프리셋이 광고 전용 스킨으로 바뀌었어요. 모양이 조금 달라질 수
          있어요.</span
        >
        <div class="sa-note-actions">
          <button class="sa-btn is-sm" type="button">옮긴 프리셋 보기</button
          ><button class="sa-btn is-sm" type="button">확인</button>
        </div>
      </div>
      <p class="sa-note is-bad" role="note">
        <span><b>소재 없음</b> · 연결된 소재가 없어 승인할 수 없어요.</span>
      </p>
    </div>
  </body>
</html>
