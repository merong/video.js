<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grok Imagine 예제 · 본편 10초</title>
    <link rel="stylesheet" href="../assets/videojs/video.css" />
    <link rel="stylesheet" href="./example.css" />
    <script type="module" src="./grok.js"></script>
  </head>
  <body class="ads-example">
    <header class="page-heading"><a href="../">광고 관리자</a><span>광고 연동 예제</span></header>
    <main>
      <h1>Grok Imagine 예제 · 본편 10초</h1>
      <p id="description">해안 도시의 독립 장면과 프리롤·미드롤·포스트롤을 확인합니다.</p>
      <nav aria-label="Grok 예제 플레이어 선택">
        <a id="mode-videojs" href="./grok.html" aria-current="page">Video.js</a>
        <a id="mode-native" href="./grok.html?mode=native">기본 video</a>
        <a href="./videojs.html">게시 편성 예제</a>
      </nav>
      <section aria-label="Grok 영상과 광고 플레이어" aria-describedby="description">
        <div id="mount" class="player-frame"></div>
        <div class="playback-state">
          <span id="phase">준비 중</span>
          <p id="status" role="status" aria-atomic="true">본편과 광고 편성을 준비하고 있습니다.</p>
        </div>
        <p id="notice" class="notice" role="alert" hidden></p>
      </section>
      <div class="session-info">
        <p id="context">편성: 시작 전 A → B · 본편 5초에 C · 종료 후 A</p>
        <button id="reload" type="button">처음부터 다시 확인</button>
      </div>
      <p class="tracking-note">통계 미수집 · 재생 기록은 이 페이지에서만 표시됩니다.</p>
      <details class="observations">
        <summary>이번 재생 기록</summary>
        <p id="empty-history">아직 관측된 광고가 없습니다.</p>
        <ol id="events" aria-label="광고 실행 순서"></ol>
      </details>
    </main>
  </body>
</html>
