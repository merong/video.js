<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>기본 video · 광고 연동 예제</title>

    <link rel="stylesheet" href="./example.css" />
    <script type="module" src="./example.js"></script>
  </head>
  <body class="ads-example" data-player="native">
    <header class="page-heading"><a href="../">광고 관리자</a><span>광고 연동 예제</span></header>
    <main>
      <h1>본편과 광고를 하나의 흐름으로.</h1>
      <p id="description">브라우저 기본 플레이어에 게시된 광고 편성을 연결합니다.</p>
      <nav aria-label="플레이어와 미디어 선택">
        <a href="./videojs.html" data-example-link>Video.js</a>
        <a href="./player.html" data-example-link>기본 video</a>
        <a href="?media=mp4" data-example-link data-media="mp4">MP4</a>
        <a href="?media=hls" data-example-link data-media="hls">HLS</a>
        <a href="./grok.html">Grok Imagine 예제</a>
      </nav>
      <section aria-label="광고 연동 플레이어" aria-describedby="description">
        <div id="mount" class="player-frame"></div>
        <div class="playback-state">
          <span id="phase">준비 중</span>
          <p id="status" role="status" aria-atomic="true">플레이어를 준비하고 있습니다.</p>
        </div>
        <p id="notice" class="notice" role="alert" hidden></p>
      </section>
      <div class="session-info">
        <p id="context"></p>
        <button id="reload" type="button">처음부터 다시 확인</button>
      </div>
      <p class="tracking-note">
        이 예제의 광고 재생은 운영 통계에 기록됩니다. 통계를 남기지 않으려면 관리자 미리보기를 이용하세요.
      </p>
      <details class="observations">
        <summary>이번 재생 기록</summary>
        <p id="empty-history">아직 관측된 광고가 없습니다.</p>
        <ol id="events" aria-label="광고 실행 순서"></ol>
      </details>
    </main>
  </body>
</html>
